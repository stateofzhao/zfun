//----------------依赖maven官方api----------------
buildscript {
    repositories {
        mavenCentral()
    }
    dependencies {
        classpath 'org.apache.maven:maven-model-builder:3.5.2'
        classpath 'org.apache.maven:maven-model:3.5.2'
    }
}
//----------------依赖maven官方api----------------


import org.gradle.internal.component.external.model.DefaultModuleComponentIdentifier
import org.gradle.api.internal.artifacts.DefaultModuleIdentifier
import org.gradle.util.GFileUtils
import org.apache.maven.model.building.DefaultModelBuildingRequest
import org.apache.maven.model.Model
import org.apache.maven.model.resolution.ModelResolver
import org.apache.maven.model.Repository
import org.apache.maven.model.Parent
import org.apache.maven.model.building.FileModelSource
import org.apache.maven.model.building.ModelSource2
import org.apache.maven.model.resolution.InvalidRepositoryException
import org.apache.maven.model.resolution.UnresolvableModelException
import org.apache.maven.model.building.DefaultModelBuilderFactory
import org.apache.maven.model.validation.DefaultModelValidator
import org.apache.maven.model.path.DefaultPathTranslator
import org.apache.maven.model.path.DefaultUrlNormalizer
import org.apache.maven.model.interpolation.StringSearchModelInterpolator


//配置项 ============================================================================================ start
//RUN_TYPE_DOWNLOAD_ALL：正常模式，会真正解析并下载依赖文件（jar/aar/pom/sources/javadoc等）到 offlineMavenOutputDir
//RUN_TYPE_LIST_DIRECT_DEPENDENCIES_ONLY：仅收集各配置【直接声明】的依赖名称，不解析传递依赖，不下载任何文件
//RUN_TYPE_LIST_ALL_DEPENDENCY_NAMES：收集【直接依赖+传递依赖】的完整依赖名称列表，不下载任何文件
def RUN_TYPE_LIST_DIRECT_DEPENDENCIES_ONLY = 'listDirectDependenciesOnly'
def RUN_TYPE_LIST_ALL_DEPENDENCY_NAMES = 'listAllDependencyNames'
def RUN_TYPE_DOWNLOAD_ALL = 'downloadAll'
def offlineMavenOutputDir = rootProject.projectDir.parent+'/offlineDepdencies/maven'
def gradleLocalCacheDir = "$gradle.gradleUserHomeDir/caches/modules-2/files-2.1"//未实现的功能

def currentRunType = RUN_TYPE_DOWNLOAD_ALL
def includeSources = true
def includeJavadocs = true
def includeMavenPom = true
def includeGradlePlugin = true //未实现的功能

def includeBuildscriptDependencies = true //是否包含构建脚本的依赖

def cleanOutputDirBeforeRun = true  //是否在拉取前清空依赖输出目录

def includedProjectNames = []//要拉取的项目；默认拉取所有项目
def includedConfigurationNames = []//要拉取的依赖配置类型，默认拉取所有，例如：implementation,compileOnly等
def includedGroupNameKeywords = []//要拉取的依赖的group，采用String.contains进行判断，所以可以仅设置group中的部分字符；默认会全部拉取
//配置项 ============================================================================================ end


//Task闭包中直接编写的代码，会在配置阶段执行。可以通过doFirst、doLast块将代码逻辑放到执行阶段中执行
//Exec类型的task，也即是此task继承自ExecTask
task downloadDependencies() {
    doFirst {
        def EMPTY_DEPENDENCY_ARRAY = new Dependency[0]

        def Map<ModuleComponentIdentifier,Set<File>> moduleArtifactFilesMap = [:]//外部依赖module包含的文件
        def Map<String,File> extraFilesToCopyMap = [:]//额外要拉取的文件
        def Set<ProjectConfigurationsWrapper> projectConfigurationWrappers = []
        def Set<ProjectRepositorySnapshot> projectRepositorySnapshots = []
        def Set<String> collectedDependencyNames = new HashSet()

        if (RUN_TYPE_DOWNLOAD_ALL != currentRunType){
            includeSources = false
            includeJavadocs = false
            includeMavenPom = false
            includeGradlePlugin = false
            cleanOutputDirBeforeRun = false
        }
        trace("##################################【downloadDependencies】任务 ################################## 开始",0)
        trace("==================配置==================",1)
        trace("offlineMavenOutputDir：           $offlineMavenOutputDir",2)
        trace("currentRunType:                   $currentRunType",2)
        trace("includeSources：                  $includeSources",2)
        trace("includeJavadocs：                 $includeJavadocs",2)
        trace("includeMavenPom：                 $includeMavenPom",2)
        trace("includeBuildscriptDependencies： $includeBuildscriptDependencies",2)
        trace("cleanOutputDirBeforeRun：         $cleanOutputDirBeforeRun",2)
        trace("includedProjectNames：            $includedProjectNames",2)
        trace("includedConfigurationNames：      $includedConfigurationNames",2)
        trace("includedGroupNameKeywords：       $includedGroupNameKeywords",2)
        trace("==================配置==================",1)

        //读取配置项
        gradle.allprojects{ project ->
            //仅处理被选中的project，未选中的project不做任何改动（包括不修改其repositories）
            def isProjectIncluded = includedProjectNames?.empty || includedProjectNames.contains(project.name)
            if (!isProjectIncluded) {
                return
            }
            //项目依赖
            def projectConfigWrapper = null
            if (includedConfigurationNames?.empty) {
                projectConfigWrapper = createProjectConfigurationsWrapper(project,project.configurations)
            } else {
                def projectConfigs = []
                includedConfigurationNames.forEach { configName ->
                    //使用findByName容错：不同project的configuration集合可能不一致，避免getByName直接抛异常导致整个task失败
                    def config = project.configurations.findByName(configName)
                    if (null != config) {
                        projectConfigs.add(config)
                    } else {
                        trace("项目【${project.name}】不存在名为【$configName】的配置，已跳过",2)
                    }
                }
                projectConfigWrapper = createProjectConfigurationsWrapper(project,projectConfigs)
            }
            //项目buildscript依赖
            if (includeBuildscriptDependencies) {
                if (null == projectConfigWrapper) {
                    projectConfigWrapper = createProjectConfigurationsWrapper(project,project.buildscript.configurations)
                } else {
                    projectConfigWrapper.appendConfigurations(project,project.buildscript.configurations)
                }
                //配置project的依赖仓库，因为project的依赖仓库是不带buildscript的依赖仓库的，所以这里需要给它们加上；
                //解析buildscript依赖用的detachedConfiguration是挂在project.configurations下的，需要project.repositories里也能找到buildscript的仓库才能解析成功。
                //注意：project.repositories.collect{it} 是对仓库列表做一份真正的拷贝（新List），而不是持有同一个RepositoryHandler引用，
                //这样任务结束后才能真正把project的repositories还原成执行前的状态。
                def originalRepositories = project.repositories.collect { it }
                project.repositories.addAll(project.buildscript.repositories)
                projectRepositorySnapshots.add(new ProjectRepositorySnapshot(project,originalRepositories))
            }
            if (null != projectConfigWrapper) {
                projectConfigurationWrappers.add(projectConfigWrapper)
            }
        }//allprojects

        //根据配置拉取依赖
        if (projectConfigurationWrappers?.empty){
            trace("无需拉取依赖",1)
            return
        }
        for (configurationsWrapper in projectConfigurationWrappers) {
            def Set<Configuration> configurations = configurationsWrapper.configurations
            def Project project = configurationsWrapper.project
            trace("【${project.name}】项目下载依赖 ============================== start",1)
            for (aConfiguration in configurations){
                trace("【${aConfiguration.name}】配置拉取 ================ start",2)

//                for (ResolvedArtifact artifact : aConfiguration.copy().resolvedConfiguration.resolvedArtifacts) {
//                    def groupName = artifact.moduleVersion.id.group
//                    def name = artifact.moduleVersion.id.name
//                    def version = artifact.moduleVersion.id.version
//
//                    def skip = shouldSkipDependency(includedGroupNameKeywords, groupName)
//                    if (skip) {
//                        trace("由于配置，忽略此依赖：${groupName}:${name}:${version}", 3)
//                        continue
//                    }
//                    if (null == groupName){
//                        trace("忽略本地libs下依赖：$dependency.module.name",3)
//                        continue
//                    }
//                    trace("读取到依赖：${groupName}:${name}:${version}", 3)
//                    def depName = "$groupName:$name:$version"
//                    collectedDependencyNames.add(depName)
//
//                    if (RUN_TYPE_DOWNLOAD_ALL != currentRunType){
//                        continue
//                    }
//                    def componentId = DefaultModuleComponentIdentifier.newId(DefaultModuleIdentifier.newId(groupName, name), version)
//                    componentIds.add(componentId)
//                    addToMultimap(moduleArtifactFilesMap, componentId, artifact.file)//it.file 为jar，aar等
//                    trace("获取到依赖文件：", componentId, resolvedArtifact.file, 3)
//                }
                for (dependency in aConfiguration.allDependencies){
                    Set<ModuleComponentIdentifier> componentIds = new HashSet<>()
                    //step 1 获取依赖
                    if (dependency instanceof ExternalModuleDependency){//外部依赖（maven库，libs中的依赖等） //只处理外部依赖
                        def groupName = dependency.module.group
                        def name = dependency.module.name
                        def version = dependency.version
                        if (null==groupName){//fixme lzf 本地libs目录下的依赖，group为null（先暂时这么用，以后找到更好的方式时再修改）
                            trace("忽略本地libs下依赖：$name",3)
                            continue
                        }
                        if (shouldSkipDependency(includedGroupNameKeywords,groupName)) {
                            trace("由于配置，忽略此依赖：$groupName:$name:$version", 3)
                            continue
                        }
                        def depName = "$groupName:$name:$version"
                        collectedDependencyNames.add(depName)
                        if (RUN_TYPE_LIST_DIRECT_DEPENDENCIES_ONLY == currentRunType){
                            continue
                        }
                        if (RUN_TYPE_DOWNLOAD_ALL == currentRunType){
                            trace("开始拉取依赖：$depName",3)
                        }
                        //step 1 获取module信息以及module的artifact文件
                        //detachedConfiguration 为每个依赖项创建一个分离的配置，以获取依赖项的所有声明版本，否则只会拉取到最新的版本
                        def configurationCopy = project.configurations.detachedConfiguration([dependency].toArray(EMPTY_DEPENDENCY_ARRAY))
                        if (configurationCopy.resolvedConfiguration.hasError()){
                            trace("无法解析此依赖：$groupName:$name:$version",3)
                            continue
                        }
                        def iterator = configurationCopy.resolvedConfiguration.resolvedArtifacts.iterator()
                        while (iterator.hasNext()) {
                            def resolvedArtifact = iterator.next()
                            def artifactSkip = shouldSkipDependency(includedGroupNameKeywords,resolvedArtifact.moduleVersion.id.group)
                            if (artifactSkip){
                                continue
                            }
                            if (RUN_TYPE_LIST_ALL_DEPENDENCY_NAMES == currentRunType){
                                collectedDependencyNames.add(">$resolvedArtifact.moduleVersion.id.group:$resolvedArtifact.moduleVersion.id.name:$resolvedArtifact.moduleVersion.id.version")
                                continue
                            }
                            def componentId = DefaultModuleComponentIdentifier.newId(DefaultModuleIdentifier.newId(resolvedArtifact.moduleVersion.id.group, resolvedArtifact.moduleVersion.id.name), resolvedArtifact.moduleVersion.id.version)
                            componentIds.add(componentId)
                            addToMultimap(moduleArtifactFilesMap, componentId, resolvedArtifact.file)//it.file 为jar，aar等
                            trace("添加依赖：", componentId, resolvedArtifact.file, 4)
                        }
                        //todo gradle官方插件虽然能拉取下来，但是无法只依赖拉取到的依赖来解析，仍然会报无法找到插件的错误
                        //下面方式拉取方不对
                        //gradle 官方插件库的插件依赖，没有找到更好的方式，暂时采用下下面这种方式来拉取
                        /*def gradlePlugin = new File(gradleLocalCacheDir,gradlePluginFile(dependency.group,dependency.module.name).path)
                        if (gradlePlugin.exists()){
                            trace("gradle Plugin Portal 拉取：${gradlePlugin.path}",3)
                            def desDir = gradlePluginOfflineDirectory(offlineMavenOutputDir, dependency.group, dependency.module.name)
                            extraFilesToCopyMap.put(desDir.path,gradlePlugin)
                        }*/
                    } else if (dependency instanceof FileCollectionDependency){//包括：本地SDK依赖，例如，Android32；本地libs下的jar依赖；不包括：本地libs下的aar(本地libs下的aar依赖最终会解析为 ExternalModuleDependency)
                        // annotationProcess配置的注解处理器依赖会走到这里，但是报这个错： Transform's input file does not exist: xxx
                        try {
                            dependency.files.forEach {
                                trace("本地依赖忽略：" + it.path, 3)
                            }
                        } catch (Exception ignore) {
                            trace("本地依赖忽略：${dependency.name}",3)
                        }
                    } else if (dependency instanceof ProjectDependency){//本地project依赖：implementation project(':projectA')
                        trace("本地project依赖忽略："+dependency.dependencyProject,3)
                    }

                    //step 2 获取依赖的 sources 和 javadocs
                    if ((includeSources || includeJavadocs) && !componentIds.empty){
                        trace("收集Java源码和Java文档",4)
                        def jvmArtifacts = project.dependencies.createArtifactResolutionQuery()
                                .forComponents(componentIds)
                                .withArtifacts(JvmLibrary, SourcesArtifact, JavadocArtifact)
                                .execute()//查询远程module仓库
                        for (component in jvmArtifacts.resolvedComponents){
                            if (includeSources){
                                def sources = component.getArtifacts(SourcesArtifact)
                                if (!sources?.empty){
                                    sources.forEach({
                                        def file = (it as ResolvedArtifactResult).file
                                        addToMultimap(moduleArtifactFilesMap,component.id,file)
                                        trace("添加依赖源码：",component.id,file,4)
                                    })
                                }
                            }

                            if (includeJavadocs){
                                def javadocs = component.getArtifacts(JavadocArtifact)
                                if (!javadocs?.empty){
                                    javadocs.forEach{
                                        def file = (it as ResolvedArtifactResult).file
                                        addToMultimap(moduleArtifactFilesMap,component.id,file)
                                        trace("添加依赖文档：",component.id,file,4)
                                    }
                                }
                            }
                        }
                    }//end if(includeSources || includeJavadocs)

                    //step 3 添加maven pom
                    if (includeMavenPom && !componentIds.empty){
                        trace("收集maven pom 文档",4)
                        def mavenArtifacts = project.dependencies.createArtifactResolutionQuery()
                                .forComponents(componentIds)
                                .withArtifacts(MavenModule, MavenPomArtifact)
                                .execute()
                        def pomModelResolver = new PomModelResolver(project)
                        for (component in mavenArtifacts.resolvedComponents){
                            def pomResults = component.getArtifacts(MavenPomArtifact)
                            if (pomResults?.empty) {
                                continue
                            }

                            for (pomArtifact in pomResults){
                                if (pomArtifact instanceof UnresolvedArtifactResult){
                                    //trace("Resolver was unable to resolve artifact:${pomArtifact.id} failMsg:{$pomArtifact.getFailure()}",4)
                                    break //只需要解析一个就行了
                                }
                                def pomFile = (pomArtifact as ResolvedArtifactResult).file
                                addToMultimap(moduleArtifactFilesMap,component.id,pomFile)
                                trace("添加MavenPom文档：",component.id,pomFile,4)

                                //解析parent pom
                                resolveParenPom(pomModelResolver,pomFile)
                                break //只需要解析一个就行了
                            }
                        }
                        //parent poms
                        def keySet = pomModelResolver.componentCache.keySet()
                        for (id in keySet){
                            def parentPomFile = pomModelResolver.componentCache.get(id)
                            addToMultimap(moduleArtifactFilesMap,id,parentPomFile)
                            trace("添加Parent MavenPom文档：",id,parentPomFile,4)
                        }
                    }//end if(includeMavenPom){}
                }//end for 解析配置项的依赖：implementation ,compileOnly等
                trace("【${aConfiguration.name}】配置拉取 ================ end",2)
            }
            trace("【${project.name}】项目下载依赖 ============================== end",1)
        }//end for 解析所有依赖

        printoutDependencies(cleanOutputDirBeforeRun,offlineMavenOutputDir,moduleArtifactFilesMap)
        //额外文件
        if (!extraFilesToCopyMap?.isEmpty()){
            def keySet = extraFilesToCopyMap.keySet()
            for (String key in keySet){
                def sourceFile = extraFilesToCopyMap.get(key)
                def desFile = new File(key)
                trace("额外文件复制到：${desFile.path}",1)
                if (sourceFile.isDirectory()) {
                    desFile.mkdirs()
                    GFileUtils.copyDirectory(sourceFile, desFile)
                } else {
                    GFileUtils.copyFile(sourceFile, desFile)
                }
            }
        }
        //将依赖名称写入文件
        if (!collectedDependencyNames.empty){
            def sb = new StringBuilder()
            collectedDependencyNames.forEach{ str->
                sb.append(str).append(System.lineSeparator())
            }
            def file = new File(offlineMavenOutputDir,"dependenciesList.txt")
            if (file.exists()){
                file.delete()
            }
            GFileUtils.writeFile(sb.toString(),file,"UTF-8")
        }
        //还原project的repository（此处的originalRepositories是执行前的真实快照，可以正确还原）
        projectRepositorySnapshots.forEach {
            it.project.repositories.clear()
            it.project.repositories.addAll(it.originalRepositories)
        }
        trace("################################## 【downloadDependencies】任务 ################################## 结束",0)
    }//doFirst

    onlyIf{
        true //即使为true也不会在构建时执行，因为他是一个单独的task，并没有依赖构建过程中的task
    }
}

//解析parent pom
static def org.apache.maven.model.Model resolveParenPom(PomModelResolver pomModelResolver,File pomFile){
    def modelBuildingRequest = new DefaultModelBuildingRequest()
    modelBuildingRequest.setSystemProperties(System.getProperties())
    modelBuildingRequest.setModelSource(new FileModelSource(pomFile))
    modelBuildingRequest.setModelResolver(pomModelResolver)

    try {
        def modelBuilder = new DefaultModelBuilderFactory().newInstance()

        def modelInterpolator = new StringSearchModelInterpolator()
        modelInterpolator.setUrlNormalizer(new DefaultUrlNormalizer())
        modelInterpolator.setPathTranslator(new DefaultPathTranslator())

        modelBuilder.setModelInterpolator(modelInterpolator)
        modelBuilder.setModelValidator(new DefaultModelValidator())

        def result = modelBuilder.build(modelBuildingRequest)

        if (!result.problems.empty) {
            result.problems.each {
                trace("${it.moduleId}:${it.message}",4)
            }
        }

        return result.effectiveModel
    } catch (Exception e) {
        String msg = "resolveParenPom exception ${pomFile.path} :${e.getMessage()}"
        trace(msg,4)
    }
    return null
}

static <K,V> void addToMultimap(Map<K,Set<V>> map, K key, V value){
    if (!map.containsKey(key)){
        map.put(key,[] as Set<V>)
    }
    map.get(key).add(value)
}

// Return the offline-repository target directory for the given component (naming follows maven conventions)
static File moduleDirectory(String offlineMavenOutputDir,ModuleComponentIdentifier ci) {
    new File(offlineMavenOutputDir, "${ci.group.tokenize(".").join("/")}/${ci.module}/${ci.version}")
}

static File gradlePluginFile(String groupName,String moduleName){
    new File("${groupName}/${moduleName}")
}

static File gradlePluginOfflineDirectory(String offlineMavenOutputDir,String groupName,String moduleName){
    new File(offlineMavenOutputDir,"${groupName.tokenize(".").join("/")}/${moduleName}")
}

//是否需要跳过此依赖：当includedGroupNameKeywords非空，且groupName不包含其中任意关键字（忽略大小写）时，返回true表示跳过
static boolean shouldSkipDependency(List<String> includedGroupNameKeywords,String groupName){
    if (includedGroupNameKeywords?.empty){
        return false
    } else {
        def safeGroupName = groupName ?: ""
        for (keyword in includedGroupNameKeywords){
            if (safeGroupName.toLowerCase().contains(keyword.toLowerCase())){
                return false
            }
        }
        return true
    }
}

static ProjectConfigurationsWrapper createProjectConfigurationsWrapper(Project project,Set<Configuration> configurations){
    if(null == project || configurations?.empty){
        return null
    }
    def configSet = new HashSet()
    configurations?.forEach{
        if (!(it?.allDependencies?.empty)){
            configSet.add(it)
        }
    }
    return new ProjectConfigurationsWrapper(project,configSet)
}

//输出依赖文件到指定目录
static def printoutDependencies(boolean cleanOutputDirBeforeRun,String offlineMavenOutputDir,Map<ModuleComponentIdentifier,Set<File>> moduleArtifactFilesMap){
    if (cleanOutputDirBeforeRun){
        trace("清空依赖输出目录：$offlineMavenOutputDir",1)
        GFileUtils.deleteDirectory(new File(offlineMavenOutputDir))
    }
    trace("开始输出依赖到指定目录：$offlineMavenOutputDir",1)
    if (moduleArtifactFilesMap?.isEmpty()){
        return
    }
    def keys = moduleArtifactFilesMap.keySet()
    for (ModuleComponentIdentifier id in keys){
        def files = moduleArtifactFilesMap.get(id)
        def dir = moduleDirectory(offlineMavenOutputDir,id)
        GFileUtils.mkdirs(dir)
        files.forEach{file->
            GFileUtils.copyFile(file,new File(dir,file.name))
        }
    }
}

static def trace(String msg,int indentation){
    def strBuild = new StringBuilder()
    for (int i =0;i<indentation;i++){
        strBuild.append('>')
    }
    if (strBuild.length() > 0) {
        strBuild.append(' ')
    }
    strBuild.append(msg)
    println strBuild.toString()
}

static def trace(String pre, ComponentIdentifier componentIdentifier, File file, int indentation) {
    def fileMsg
    if (null != file){
        fileMsg = " == 文件路径${file.getAbsoluteFile()}"
    }else {
        fileMsg = ""
    }
    def msg = ""
    if (componentIdentifier instanceof DefaultModuleComponentIdentifier) {
        def id = componentIdentifier as DefaultModuleComponentIdentifier
        msg = pre + "${id.group}:${id.module}:${id.version}$fileMsg"
    } else {
        msg = pre + "${componentIdentifier.displayName}$fileMsg"
    }
    trace(msg , indentation)
}

//某个project下要拉取的所有Configuration（包含项目自身配置以及可选的buildscript配置）
class ProjectConfigurationsWrapper{
    def Set<Configuration> configurations
    def Project project
    ProjectConfigurationsWrapper(Project proj,Set<Configuration> confs){
        this.project = proj
        this.configurations = confs
    }

    def appendConfigurations(Project proj,Set<Configuration> confs){
        if (project == proj){
            if (!confs?.empty){
                def configSet = []
                confs.forEach{
                    if (!it.allDependencies?.empty){
                        configSet.add(it)
                    }
                }
                configurations?.addAll(configSet)
            }
        }
    }
}//class ProjectConfigurationsWrapper end

//某个project在被临时合并了buildscript仓库之前的仓库快照，任务结束后用于还原
class ProjectRepositorySnapshot{
    def Project project
    def List originalRepositories
    ProjectRepositorySnapshot(Project proj,List originalRepos){
        project = proj
        originalRepositories = originalRepos
    }
}//class ProjectRepositorySnapshot end

class PomModelResolver implements ModelResolver{
    def Project project
    def Map<String, FileModelSource> pomCache = [:]
    def Map<ModuleComponentIdentifier, File> componentCache = [:]

    PomModelResolver(Project proj){
        project = proj
    }

    @Override
    ModelSource2 resolveModel(org.apache.maven.model.Parent parent) throws UnresolvableModelException {
        return resolveModel(parent.groupId, parent.artifactId, parent.version)
    }

    @Override
    ModelSource2 resolveModel(org.apache.maven.model.Dependency dependency) throws UnresolvableModelException {
        return resolveModel(dependency.groupId, dependency.artifactId, dependency.version)
    }

    @Override
    ModelSource2 resolveModel(String groupId, String artifactId, String version) throws UnresolvableModelException {
        def id = "$groupId:$artifactId:$version".toString()
        if (!pomCache.containsKey(id)) {
            def mavenArtifacts = project.dependencies.createArtifactResolutionQuery()
                    .forComponents(DefaultModuleComponentIdentifier.newId(DefaultModuleIdentifier.newId(groupId, artifactId), version))
                    .withArtifacts(MavenModule, MavenPomArtifact)
                    .execute()
            def component = mavenArtifacts.resolvedComponents.first()
            def poms = component.getArtifacts(MavenPomArtifact)
            if (poms?.empty) {
                return null
            }
            def pomArtifact = poms.first()
            if (pomArtifact instanceof UnresolvedArtifactResult) {
                trace("Resolver was unable to resolve artifact:${pomArtifact.id} failMsg:{$pomArtifact.getFailure()}",4)
                return null
            }
            def pomFile = pomArtifact.file as File

            def componentId = DefaultModuleComponentIdentifier.newId(DefaultModuleIdentifier.newId(groupId, artifactId), version)
            componentCache[componentId] = pomFile

            def pom = new FileModelSource(pomFile)
            pomCache[id] = pom
            return pom
        }
        return pomCache[id]
    }

    @Override
    void addRepository(org.apache.maven.model.Repository repository, boolean replace) throws InvalidRepositoryException {}

    @Override
    void addRepository(org.apache.maven.model.Repository repository) throws InvalidRepositoryException {}

    @Override
    ModelResolver newCopy() { return this }
}//class PomModelResolver end


